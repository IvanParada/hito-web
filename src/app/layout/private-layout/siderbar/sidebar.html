<aside class="flex h-screen w-20 flex-col bg-zinc-900 text-white">

    <div class="flex flex-col items-center gap-6 pt-6">

        <a routerLink="/app/dashboard" routerLinkActive="bg-white/10" [routerLinkActiveOptions]="{ exact: true }" class="
        relative
        flex h-10 w-10
        items-center justify-center
        rounded-lg
        transition
        hover:bg-white/10
      ">
            <span class="
          absolute
          -left-5
          h-9 w-[3px]
          rounded-full
          bg-white
          opacity-0
        " routerLinkActive="opacity-100"></span>

            <img src="/icons/dashboard.svg" alt="Dashboard" class="h-5 w-auto object-contain" />
        </a>

        <a routerLink="/app/clients" routerLinkActive="bg-white/10" class="
        relative
        flex h-10 w-10
        items-center justify-center
        rounded-lg
        transition
        hover:bg-white/10
      ">
            <span class="
          absolute
          -left-5
          h-9 w-[3px]
          rounded-full
          bg-white
          opacity-0
        " routerLinkActive="opacity-100"></span>

            <img src="/icons/users.svg" alt="Clients" class="h-5 w-auto object-contain" />
        </a>

        <a routerLink="/app/projects" routerLinkActive="bg-white/10" class="
        relative
        flex h-10 w-10
        items-center justify-center
        rounded-lg
        transition
        hover:bg-white/10
      ">
            <span class="
          absolute
          -left-5
          h-9 w-[3px]
          rounded-full
          bg-white
          opacity-0
        " routerLinkActive="opacity-100"></span>

            <img src="/icons/projects.svg" alt="Projects" class="h-5 w-auto object-contain" />
        </a>

        <a routerLink="/app/materials" routerLinkActive="bg-white/10" class="
        relative
        flex h-10 w-10
        items-center justify-center
        rounded-lg
        transition
        hover:bg-white/10
      ">
            <span class="
          absolute
          -left-5
          h-9 w-[3px]
          rounded-full
          bg-white
          opacity-0
        " routerLinkActive="opacity-100"></span>

            <img src="/icons/catalog.svg" alt="Materials" class="h-5 w-auto object-contain" />
        </a>

        <a routerLink="/app/settings" routerLinkActive="bg-white/10" class="
        relative
        flex h-10 w-10
        items-center justify-center
        rounded-lg
        transition
        hover:bg-white/10
      ">
            <span class="
          absolute
          -left-5
          h-9 w-[3px]
          rounded-full
          bg-white
          opacity-0
        " routerLinkActive="opacity-100"></span>

            <img src="/icons/settings.svg" alt="Settings" class="h-5 w-auto object-contain" />
        </a>

    </div>

    <div class="mt-auto flex justify-center pb-6">
        <button type="button" class="
        flex h-10 w-10
        items-center justify-center
        rounded-lg
        transition
        hover:bg-white/10
      " (click)="logout()">
            <img src="/icons/logout.svg" alt="Logout" class="h-5 w-auto object-contain" />
        </button>
    </div>

</aside>
