<div class="flex flex-col items-center justify-center w-full max-w-md p-4 mx-auto space-y-8">
  <h1 class="text-3xl font-bold text-zinc-800">Crear cuenta</h1>
  <form [formGroup]="registerForm" class="w-full space-y-6" (ngSubmit)="onSubmit()"> >

    <app-input label="Nombre" type="text" placeholder="Tu nombre" [control]="nameControl"
      errorMessage="El nombre es obligatorio y debe tener al menos 3 caracteres" />

    <app-input label="Correo electrónico" type="email" placeholder="nombre@empresa.com" [control]="emailControl"
      errorMessage="Ingresa un correo electrónico válido" />

    <app-input label="Contraseña" type="password" placeholder="••••••••••" [control]="passwordControl"
      errorMessage="La contraseña es obligatoria" />

    <app-input label="Confirmar contraseña" type="password" placeholder="••••••••••" [control]="confirmPasswordControl"
      errorMessage="Las contraseñas no coinciden" />

    <app-dropdown label="Tipo de organización" [control]="organizationTypeControl"
      [options]="organizationTypes"
      errorMessage="Selecciona un tipo de organización" />

    <app-input label="Nombre de la organización" type="text" placeholder="Nombre de tu organización" [control]="organizationNameControl"
      errorMessage="El nombre de la organización es obligatorio" />

    <app-button label="Crear cuenta" variant="primary" type="submit" [fullWidth]="true" [disabled]="isLoading()" />
  </form>
</div>
